name: Production health
on:
  schedule:
    # Daily 13:15 UTC. GitHub may delay scheduled runs.
    - cron: "15 13 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the public site
        run: node scripts/health-check.mjs
